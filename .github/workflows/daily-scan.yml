name: Günlük Android Fikir Taraması

on:
  schedule:
    # Her gün 07:00 (İstanbul saatiyle, yaz saati UTC+3) -> UTC 04:00
    - cron: "0 4 * * *"
  workflow_dispatch: {}  # manuel tetiklemek için

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu çek
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bağımlılıkları yükle
        run: pip install -r android-fikir-botu/requirements.txt

      - name: Taramayı çalıştır
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python android-fikir-botu/scan.py
